<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a2a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#04040e"/>

  <!-- Outer red border ring -->
  <rect x="1" y="1" width="30" height="30" rx="5"
        fill="rgba(255,42,42,0.07)"
        stroke="#ff2a2a"
        stroke-width="0.75"
        stroke-opacity="0.35"/>

  <!-- Red fill frame -->
  <rect x="4" y="4" width="24" height="24" rx="3.5"
        fill="url(#redGlow)"
        filter="url(#innerGlow)"/>

  <!-- Dark center punch-out -->
  <rect x="9" y="9" width="14" height="14" rx="2"
        fill="#04040e"/>
</svg>
